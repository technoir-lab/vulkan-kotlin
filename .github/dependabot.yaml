version: 2
updates:
  - package-ecosystem: "gradle"
    cooldown:
      exclude:
        - "io.technoirlab:*"
        - "io.technoirlab.*:*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    cooldown:
      exclude:
        - "technoir-lab/*"
    directory: "/"
    schedule:
      interval: "monthly"
