name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ checks_requested ]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VULKAN_SDK_VERSION: 1.4.357.0

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ macos-26, ubuntu-26.04 ]

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v5.7.0
        with:
          java-version: 21
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v6.1.0
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('settings.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Install Vulkan SDK
        uses: technoir-lab/install-vulkan-sdk@v1.4.0
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          components: com.lunarg.vulkan.volk com.lunarg.vulkan.ios
          cache: true

      - name: Build with Gradle
        run: ./gradlew build --scan

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6.4.2
        if: success() || failure()
        with:
          check_name: JUnit Test Report (${{ matrix.os }})
          report_paths: '**/build/test-results/*Test/TEST-*.xml'
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          detailed_summary: true
          fail_on_parse_error: true

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1.73.2
        with:
          level: warning
          fail_level: warning
